[package]
name = "cubo-desktop"
version = "0.1.0"
description = "Aplicación de escritorio para análisis CFOP de cubo 3x3 GAN"
authors = ["David"]
edition = "2021"

[lib]
name = "cubo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cubo_cfop = { path = ".." }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1.0"
